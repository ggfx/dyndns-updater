networks:
  dyndns_network:

services:
  dyndns-redis:
    image: redis:latest
#    container_name: redis
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    command: redis-server --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5    
    networks:
      - dyndns_network

  dyndns-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=0.0.0.0
      - PORT=4321
    volumes:
      - ./frontend/data:/app/data
    depends_on:
      - dyndns-redis
    networks:
      - dyndns_network

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      DOMAIN_DYNDNS_UPDATER: ${DOMAIN_DYNDNS_UPDATER:?DOMAIN_DYNDNS_UPDATER environment variable is required}
    networks:
      - dyndns_network