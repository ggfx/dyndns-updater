<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 200 200">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Globe -->
    <circle cx="100" cy="100" r="60" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 100 40 Q 125 65 125 100 Q 125 135 100 160 Q 75 135 75 100 Q 75 65 100 40" fill="#1e40af" opacity="0.25"/>
    
    <!-- Horizontal latitude lines -->
    <ellipse cx="100" cy="100" rx="60" ry="16" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <ellipse cx="100" cy="75" rx="60" ry="10" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>
    <ellipse cx="100" cy="125" rx="60" ry="10" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>
    
    <!-- Vertical meridian -->
    <line x1="100" y1="40" x2="100" y2="160" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>
    
    <!-- Refresh arrows (curved arrows representing dynamic updates) -->
    <!-- Top-right arrow (green for "update") -->
    <path d="M 148 65 A 45 45 0 0 1 158 95" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="158,95 168,92 160,78" fill="#10b981"/>
    
    <!-- Bottom-left arrow -->
    <path d="M 52 135 A 45 45 0 0 1 42 105" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="42,105 32,108 40,122" fill="#10b981"/>
    
    <style>
        circle, path, line, ellipse, polygon { 
            transition: all 0.3s ease; 
        }
        @media (prefers-color-scheme: light) {
            circle { stroke: #e2e8f0; }
            circle:nth-of-type(2) { stroke: #60a5fa; }
            path, ellipse, line { stroke: #60a5fa; }
            path[d*="M 148"] { stroke: #059669; }
            polygon { fill: #059669; }
        }
    </style>
</svg>
